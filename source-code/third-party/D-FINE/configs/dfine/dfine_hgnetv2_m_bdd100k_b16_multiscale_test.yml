__include__: [
  '../dataset/bdd100k_detection_smoke.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
]

output_dir: /root/rivermind-data/autodrive/results/detection/dfine_m_bdd100k_smoke

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# Smoke validates only data, model, AMP, forward/backward, validation, and checkpoint workflows.
epochs: 5

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      policy:
        epoch: 5
  collate_fn:
    stop_epoch: 5
    ema_restart_decay: 0.9999
    base_size_repeat: 0

val_dataloader:
  total_batch_size: 16
