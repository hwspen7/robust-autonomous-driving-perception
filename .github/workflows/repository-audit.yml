name: repository-audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate dependency profiles
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("requirements.txt").read_text()
          dfine = Path("requirements-dfine.txt").read_text()

          for required in (
              "torch==2.2.2+cu118",
              "torchvision==0.17.2+cu118",
              "ultralytics==8.4.115",
          ):
              assert required in main, required

          for required in (
              "torch==2.5.1+cu121",
              "torchvision==0.20.1+cu121",
              "transformers==5.14.1",
          ):
              assert required in dfine, required

          assert main != dfine
          print("PASS: separate pinned Main and D-FINE profiles are present")
          PY

      - name: Verify release source provenance and runtime layout
        run: |
          python source-code/utilities/runtime-layout/prepare_runtime_layout.py \
            --preflight-only \
            --project-root "$PWD"

      - name: Compile project-owned Python sources in memory
        run: |
          python - <<'PY'
          from pathlib import Path

          count = 0
          for path in Path("source-code").rglob("*.py"):
              if "third-party" in path.parts:
                  continue
              compile(path.read_bytes(), str(path), "exec")
              count += 1

          print(f"PASS: {count} project-owned Python files compile")
          PY

      - name: Validate artifact and archive metadata
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          assert Path("README.md").is_file()

          manifest = json.loads(Path("artifacts/manifest.json").read_text())
          assert manifest["status"] == "complete"
          assert manifest["artifact_count"] == 114
          assert len(manifest["artifacts"]) == 114

          checksum_lines = [
              line for line in Path("artifacts/checksums.sha256")
              .read_text()
              .splitlines()
              if line.strip()
          ]
          assert len(checksum_lines) == 114

          dependency = json.loads(
              Path("artifacts/archive-dependencies.json").read_text()
          )
          assert dependency["status"] == "complete"
          assert dependency["dependency_count"] == 183
          assert dependency["resolution_counts"] == {
              "active-shared": 20,
              "local-archive": 163,
          }
          dependency_records = {
              (record["manifest"], record["logical_path"]): record
              for record in dependency["dependencies"]
          }
          assert len(dependency_records) == 183

          resolved = list(csv.DictReader(
              Path(
                  "project-management/audits/manifest-resolution/"
                  "resolved-artifacts.tsv"
              ).open(newline=""),
              delimiter="\t",
          ))
          assert len(resolved) == 581

          active_direct = [
              record for record in resolved
              if record["resolution"] == "active-direct"
          ]
          assert len(active_direct) == 398

          declared_external = {
              record["path"]: record
              for record in manifest["artifacts"]
          }
          verified_present = 0
          verified_external = 0

          for record in active_direct:
              path = Path(record["physical_path"])
              if path.is_file():
                  assert path.stat().st_size == int(record["bytes"]), path
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert actual == record["sha256"], path
                  verified_present += 1
                  continue

              external = declared_external.get(record["physical_path"])
              assert external is not None, path
              assert external["bytes"] == int(record["bytes"]), path
              assert external["sha256"] == record["sha256"], path
              verified_external += 1

          assert verified_present == 351
          assert verified_external == 47

          verified_shared = 0
          for record in resolved:
              if record["resolution"] == "active-direct":
                  continue

              key = (record["manifest"], record["logical_path"])
              declared = dependency_records.get(key)
              assert declared is not None, key
              for field in (
                  "resolution",
                  "physical_path",
                  "sha256",
              ):
                  assert declared[field] == record[field], (key, field)
              assert declared["bytes"] == int(record["bytes"]), key

              if record["resolution"] == "active-shared":
                  path = Path(record["physical_path"])
                  if path.is_file():
                      assert path.stat().st_size == int(record["bytes"]), path
                      actual = hashlib.sha256(path.read_bytes()).hexdigest()
                      assert actual == record["sha256"], path
                  else:
                      external = declared_external.get(
                          record["physical_path"]
                      )
                      assert external is not None, path
                      assert external["bytes"] == int(record["bytes"]), path
                      assert external["sha256"] == record["sha256"], path
                  verified_shared += 1

          assert verified_shared == 20

          print(
              "PASS: 351 bundled and 47 declared-external scientific "
              "manifest entries are valid"
          )
          print(
              "PASS: 20 shared artifacts and all 183 archive "
              "dependency declarations are valid"
          )
          PY
